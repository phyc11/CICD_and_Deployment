[project]
name = "my-python-ci"
version = "0.1.0"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black"
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.pyright]
extraPaths = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
